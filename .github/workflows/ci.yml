name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend/app scripts
      - run: python scripts/validate_demo_assets.py
      - run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
      - name: Validate Docker Compose configuration
        run: |
          cp backend/.env.example backend/.env
          docker compose config >/dev/null
      - name: Validate Windows deployment script syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/deploy.ps1)) | Out-Null'

  backend-integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight integration dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "fastapi>=0.115,<1"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "python-multipart>=0.0.9"
          "qdrant-client>=1.12,<2"
          "rank-bm25>=0.2.2"
          "httpx>=0.27,<1"
          "PyJWT>=2.9,<3"
          "numpy>=1.26,<3"
      - name: Run real Qdrant API/RBAC/retrieval integration
        run: python scripts/qdrant_integration.py
      - name: Verify conversation persistence + ownership + Citation
        run: python scripts/conversation_integration.py
      - name: Verify multi-turn context + Local Fast Path
        run: python scripts/conversation_p1_integration.py
      - name: Verify warm BM25 cache against real Qdrant
        run: python scripts/retrieval_cache_integration.py
      - name: Verify P1.6 metadata/RRF/query-enrichment/Ollama policy
        run: python scripts/p16_retrieval_integration.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
