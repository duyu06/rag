name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # SECA-20（SEC-A 验收矩阵第 20 行）的执行位置：这一步必须排在主门之前——GitHub 的步骤
      # 一旦失败，同一 job 后续步骤不再执行 ⇒ 排在主门之后，它在主门红的那次运行里永远轮不到。
      # 依赖现状：本 job 装**整份** backend/requirements.txt（下面那枚安装步就是唯一真源）；
      # backend-integration 仍是它自己那套手写轻量清单。两枚 job 跑法不同——这里用 pytest 收
      # 整个 backend/tests、经 conftest；那边只跑 scripts/*.py——依赖来源随之分家，别互相抄：
      # 往这里加包名会红在豁免表钉上（f6c67b5 那版正是手写清单，远端当场 ModuleNotFoundError: httpx）。
      # 历史（已作废，只当事故记录读）：B0 之前本 job 刻意取"能 import `app.*` 的最小集"、与
      # backend-integration 同源；只装 pydantic+argon2 的第一版在 CI 收集阶段就红、本地却绿。
      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: b0-${{ runner.os }}-py3.12-cpu-torch-${{ hashFiles('backend/requirements.txt') }}
      - name: Install backend dependencies (same source as requirements.txt)
        run: |
          # B0 §5.1：依赖真源只有 backend/requirements.txt 一份。
          # torch 这一行不是新增依赖，是**发行源选择**：sentence-transformers 的传递依赖，
          # CPU wheel ~200MB 而不是默认那个带 CUDA 的 ~2.5GB。配方照抄 backend-quality。
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Run SECA-20 delivery-surface secret scan
        run: >-
          python -m pytest backend/tests/test_secret_hygiene_contract.py -q
          -k "tracked_files or exemption_table or states_why or planted_credential or exempt_line"
      - run: python -m compileall -q backend/app scripts
      - run: python scripts/validate_demo_assets.py
      # B0 §5.2 的两条顺序理由在下面 (1)(2)。这枚契约分两半，别把两半混成一半：
      #   机器钉（test_step_ordering_still_explains_itself）的是 step 相对顺序严格递增
      #   （扫描 < 主门 < compose < pwsh）——把扫描步挪到主门之后当场红；文字那半边只 grep
      #   两枚 token 还在不在 job 块里。两枚 token 的供给点不对称，人审因此省不掉：扫描步
      #   那枚由 step 的**名字**自己供着（删注释删不掉它），旧 runner 那枚在 job 块里只出现
      #   一次、就系在下面“原既有步已删除”那一句上 ⇒ 删那一句才红，删 (1) 或删 (2) 门都照绿。
      #   所以 (1)(2) 的取舍与措辞由**人审**担保（规格要求它们逐字留在树上），别以为门拦得住。
      #   (1) SECA-20 扫描步排在主门之前：成本为零，主门红了扫描照样已报。
      #   (2) compose/pwsh 两步保持在最后：它们在主门不再恒红之后才第一次真起跑（B0-10）。
      # 原既有步 `python -m unittest discover -s backend/tests -p 'test_*.py' -v` 已删除：
      # 它从原理上收不到模块级裸函数（§2 的 45 枚差），且它在 main 上本就红，红到吞掉后面两步。
      - name: "Run backend contract suite (single runner: pytest)"
        run: python -m pytest backend/tests -q
      - name: Validate Docker Compose configuration
        run: |
          cp backend/.env.example backend/.env
          docker compose config >/dev/null
      - name: Validate Windows deployment script syntax
        shell: pwsh
        run: '[scriptblock]::Create((Get-Content -Raw scripts/deploy.ps1)) | Out-Null'

  backend-integration:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight integration dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          "fastapi>=0.115,<1"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "python-multipart>=0.0.9"
          "qdrant-client>=1.12,<2"
          "rank-bm25>=0.2.2"
          "httpx>=0.27,<1"
          "PyJWT>=2.9,<3"
          "numpy>=1.26,<3"
      - name: Run real Qdrant API/RBAC/retrieval integration
        run: python scripts/qdrant_integration.py
      - name: Verify conversation persistence + ownership + Citation
        run: python scripts/conversation_integration.py
      - name: Verify multi-turn context + Local Fast Path
        run: python scripts/conversation_p1_integration.py
      - name: Verify warm BM25 cache against real Qdrant
        run: python scripts/retrieval_cache_integration.py
      - name: Verify P1.6 metadata/RRF/query-enrichment/Ollama policy
        run: python scripts/p16_retrieval_integration.py

  backend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache real BGE model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: yaoke-bge-small-zh-v1.5-${{ runner.os }}
      - name: Install CPU model-quality dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            "sentence-transformers>=3.0,<6" \
            "qdrant-client>=1.12,<2" \
            "rank-bm25>=0.2.2" \
            "pydantic>=2.8,<3" \
            "pydantic-settings>=2.4,<3" \
            "pymupdf>=1.24,<2" \
            "python-docx>=1.1,<2" \
            "ddgs>=9.0,<10"
      - name: Compare P1.5 vs P1.6 with real BGE
        run: python scripts/p16_real_bge_ab.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
